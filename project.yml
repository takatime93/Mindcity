name: MindCity
options:
  bundleIdPrefix: com.mindcity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    INFOPLIST_FILE: MindCity/Info.plist

targets:
  MindCity:
    type: application
    platform: iOS
    sources:
      - path: MindCity
        excludes:
          - "**/*.xcassets"
      - path: MindCity/Resources/Assets.xcassets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindcity.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MindCity/Info.plist
    info:
      path: MindCity/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""

  MindCityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MindCityTests
    dependencies:
      - target: MindCity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mindcity.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MindCity:
    build:
      targets:
        MindCity: all
        MindCityTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MindCityTests
    archive:
      config: Release
